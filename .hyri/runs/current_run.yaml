schema_version: governed_hyri_run_v0
run_id: adopt_taskflow_readme_v1
profile: booklet_plus_repo_v0
stage: ADOPT_EXISTING_ARTIFACT
role: adoption
active_object:
  id: examples_taskflow_readme_adoption
  path: governance/adoptions/examples_taskflow_README_adoption.md

inputs:
  - path: examples/taskflow/README.md
    role: target_artifact
    required: true

required_outputs:
  - path: governance/adoptions/examples_taskflow_README_adoption.md

allowed_write_paths:
  - governance/adoptions/examples_taskflow_README_adoption.md

forbidden_paths:
  - examples/taskflow/README.md
  - examples/taskflow/src/
  - examples/taskflow/tests/
  - book/
  - evals/
  - mcp/
  - claude/
  - .github/

does_not_count:
  - rewriting, editing, or improving examples/taskflow/README.md in any way
  - a certificate that does not contain the artifact's real, current sha256 hash
  - claiming the artifact was natively produced under governance (it predates Governed HyRI)
  - claiming full readiness validation of the companion repo (a prior audit returned NO-GO, unrelated to this adoption)
  - status_summary_only

success_validators:
  - validate_existing_artifact_exists
  - validate_artifact_is_declared_final_deliverable
  - validate_artifact_hash_captured
  - validate_target_file_not_modified
  - validate_required_readme_sections_present
  - validate_no_forbidden_paths_touched

minimum_requirements:
  required_sections:
    - "Running"
    - "Testing"

human_gate_after: true
